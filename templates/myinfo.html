{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나의 정보</title>

    <link rel="stylesheet" href="{% static 'css/myinfo.css' %}">
</head>

<body>

<header class="navbar">

    <a href="#" class="nav-item">
        🏠
        <span>검색하기</span>
    </a>

    <a href="#" class="nav-item">
        ✎
        <span>설명서 작성</span>
    </a>

    <a href="#" class="nav-item">
        ❔
        <span>질문 목록</span>
    </a>

    <a href="#" class="nav-item">
        🔖
        <span>나의 저장소</span>
    </a>

    <a href="#" class="nav-item active">
        👤
        <span>나의 정보</span>
    </a>

    <a href="#" class="nav-item">
        ↪
        <span>로그아웃</span>
    </a>

</header>


<main class="container">

    <section class="title-box">

        <h1>
            나의 정보를<br>
            수정할 수 있습니다!
        </h1>

        <p>
            필요한 정보를<br>
            안전하게 관리하세요.
        </p>

    </section>


    <section class="info-form">


        <div class="info-row">
            <label>현재 아이디</label>

            <div class="input-area">
                <input type="text" disabled>
                <button>수정</button>
            </div>

        </div>


        <div class="info-row">

            <label>현재 이메일 주소</label>

            <div class="input-area">
                <input type="email" disabled>
                <button>수정</button>
            </div>

        </div>



        <div class="info-row">

            <label>이름</label>

            <div class="input-area">
                <input type="text" disabled>
                <button>수정</button>
            </div>

        </div>



        <div class="info-row">

            <label>생년월일</label>

            <div class="input-area">
                <input type="text" disabled>
                <button>수정</button>
            </div>

        </div>



        <div class="info-row">

            <label>현재 비밀번호</label>

            <div class="input-area">
                <input type="password" disabled>
                <button>수정</button>
            </div>

        </div>


    </section>

</main>


</body>
</html>
