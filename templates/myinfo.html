{% extends 'base.html' %}
{% load static %}


{% block title %}
나의 정보 - 똑디
{% endblock %}



{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/myinfo.css' %}">
{% endblock %}



{% block content %}

<main class="myinfo-page">


    <!-- 소개 영역 -->
    <section class="title-box">


        <h1 class="text-h1">
            나의 정보를<br>
            수정할 수 있습니다!
        </h1>


        <p class="text-body">
            필요한 정보를<br>
            안전하게 관리하세요.
        </p>


    </section>





    <!-- 정보 수정 영역 -->
    <section class="info-form card">


        <!-- 아이디 -->
        <div class="info-row">

            <label for="username">
                현재 아이디
            </label>


            <div class="input-area">

                <input 
                    id="username"
                    type="text"
                    value=""
                    disabled
                >


                <button 
                    type="button"
                    class="btn btn-secondary edit-btn"
                >
                    수정
                </button>

            </div>

        </div>





        <!-- 이메일 -->
        <div class="info-row">

            <label for="email">
                현재 이메일 주소
            </label>


            <div class="input-area">

                <input 
                    id="email"
                    type="email"
                    value=""
                    disabled
                >


                <button 
                    type="button"
                    class="btn btn-secondary edit-btn"
                >
                    수정
                </button>

            </div>

        </div>





        <!-- 이름 -->
        <div class="info-row">

            <label for="name">
                이름
            </label>


            <div class="input-area">

                <input 
                    id="name"
                    type="text"
                    value=""
                    disabled
                >


                <button 
                    type="button"
                    class="btn btn-secondary edit-btn"
                >
                    수정
                </button>

            </div>

        </div>





        <!-- 생년월일 -->
        <div class="info-row">

            <label for="birth">
                생년월일
            </label>


            <div class="input-area">

                <input 
                    id="birth"
                    type="date"
                    value=""
                    disabled
                >


                <button 
                    type="button"
                    class="btn btn-secondary edit-btn"
                >
                    수정
                </button>

            </div>

        </div>





        <!-- 비밀번호 -->
        <div class="info-row">

            <label for="password">
                현재 비밀번호
            </label>


            <div class="input-area">

                <input 
                    id="password"
                    type="password"
                    value=""
                    disabled
                >


                <button 
                    type="button"
                    class="btn btn-secondary edit-btn"
                >
                    수정
                </button>

            </div>

        </div>



    </section>


</main>


{% endblock %}





{% block extra_js %}
<script src="{% static 'js/myinfo.js' %}"></script>
{% endblock %}
