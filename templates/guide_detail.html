{% extends 'base.html' %}
{% load static %}

{% block title %}설명서 상세 - 똑디{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/guide_detail.css' %}?v=2">
{% endblock %}

{% block content %}
<div class="guide-detail-page page-wrap">
    <button type="button" class="detail-back-btn" id="detailBackBtn">
        <span class="material-symbols-rounded">chevron_left</span>
        이전
    </button>

    <p class="detail-status" id="detailStatus" role="status">설명서를 불러오는 중입니다.</p>

    <div id="guideDetailContent" hidden>
        <div class="detail-header">
            <div>
                <h1 class="detail-title" id="guideTitle"></h1>
                <p class="detail-meta" id="guideMeta"></p>
            </div>
            <div class="header-actions">
                <button type="button" class="save-btn" id="saveBtn">
                    <span class="material-symbols-rounded">bookmark</span>
                    <span class="action-label">저장하기</span>
                </button>
                <button type="button" class="like-btn" id="likeBtn">
                    <span class="material-symbols-rounded">thumb_up</span>
                    <span class="action-label">도움이 됐어요</span>
                </button>
            </div>
        </div>

        <div class="detail-layout">
            <div class="content-area" id="guideSteps"></div>
            <aside class="step-nav-area" id="stepNavArea">
                <nav class="step-nav" id="stepNav" aria-label="설명서 단계"></nav>
            </aside>
        </div>
    </div>

    <form hidden>{% csrf_token %}</form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    window.DDOKDI_IS_AUTHENTICATED = {{ user.is_authenticated|yesno:"true,false" }};
    window.DDOKDI_LOGIN_URL = "{% url 'login' %}";
</script>
<script src="{% static 'js/guide_detail.js' %}?v=2"></script>
{% endblock %}
