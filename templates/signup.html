<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/signup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- nav -->
    <header>

        <div class="nav">

            <a href="#"><i class="fa-solid fa-house"></i> 검색하기</a>

            <a href="#"><i class="fa-solid fa-pen"></i> 설명서 작성</a>

            <a href="#"><i class="fa-regular fa-circle-question"></i> 질문하기</a>

            <a href="#"><i class="fa-regular fa-bookmark"></i> 나의 저장소</a>

            <a href="#"><i class="fa-regular fa-user"></i> 나의 정보</a>

            <a href="#"><i class="fa-solid fa-right-from-bracket"></i> 로그아웃</a>

        </div>

    </header>



<main class="signup-page">


    <!-- 왼쪽 설명 -->
    <section class="intro">

        <h1>
            회원가입 페이지 입니다.
        </h1>


        <p>
            똑똑의 가족이 되어주세요
        </p>


        <span>
            (추후 문구 수정예정)
        </span>


    </section>



    <!-- 오른쪽 회원가입 -->
    <section class="signup-card">


        <form>


            <div class="form-group">

                <label>
                    원하시는 아이디를 밑에 입력해주세요
                </label>

                <input type="text">

            </div>



            <div class="form-group">

                <label>
                    이메일 주소를 밑에 입력해주세요
                </label>

                <input type="email">

            </div>



            <div class="form-group">

                <label>
                    성함을 밑에 입력해주세요
                </label>

                <input type="text">

            </div>



            <div class="form-group">

                <label>
                    생년월일을 밑에 입력해주세요
                </label>

                <input type="date">

            </div>



            <div class="form-group">

                <label>
                    원하시는 비밀번호를 밑에 입력해주세요
                </label>

                <input type="password">

            </div>



            <div class="form-group">

                <label>
                    위의 비밀번호를 밑에 한번 더 입력해주세요
                </label>

                <input type="password">

            </div>



            <button type="submit">
                회원가입 완료
            </button>


        </form>


    </section>


</main>



</body>
</html>
