{% extends 'base.html' %}
{% load static %}

{% block title %}
설명서 사진 편집 - 똑디
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/guide_create_2.css' %}">
{% endblock %}

{% block content %}
<div class="guide-edit-page">
    
    <div class="page-header">
        <h1>설명서 작성 2. 사진 편집</h1>
        <p>사진 아래 "그림으로 표시" 버튼을 눌러 강조할 부분에 동그라미, 화살표, 텍스트를 추가해주세요.</p>
    </div>

    <!-- 상단 썸네일 네비게이션 (업로드한 사진 목록) -->
    <div class="thumbnail-list" id="thumbnailList">
        <!-- JS로 이전 페이지에서 넘겨받은 이미지들의 썸네일이 동적으로 들어옵니다 -->
    </div>

    <div class="edit-section">
        <!-- 1. 사진 위 주석(동그라미/화살표/텍스트) 편집 영역 -->
        <div class="form-group">
            <label>화면 사진</label>

            <div class="canvas-container" id="canvasContainer">
                <!-- 선택된 메인 이미지 -->
                <img id="mainImage" src="" alt="편집 중인 화면">
            </div>

            <button
                type="button"
                id="annotateImageBtn"
                class="btn btn-outline annotate-image-btn"
            >
                ✏️ 그림으로 표시
            </button>
        </div>

        <!-- 2. 하단 줄글 설명 영역 -->
        <div class="form-group">
            <label for="bottomDesc">하단 설명 (선택)</label>
            <textarea 
                id="bottomDesc" 
                class="bottom-desc-input" 
                placeholder="어르신들이 이해하기 쉽게 화면에 대한 부가 설명을 적어주세요. (예: 우측 상단의 돋보기 버튼을 누르세요.)"
                rows="3"
            ></textarea>
        </div>
    </div>

    <div class="submit-area action-buttons">
        <!-- 이전 단계로 돌아가기 -->
        <button type="button" class="btn btn-outline" onclick="history.back();">
            ← 이전 단계
        </button>
        
        <!-- 최종 저장 (백엔드로 데이터 전송) -->
        <button type="button" class="btn btn-primary" id="saveCompleteBtn">
            설명서 완성하기!
        </button>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/image-annotator.js' %}"></script>
<script src="{% static 'js/guide_create_2.js' %}"></script>
{% endblock %}
