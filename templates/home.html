{% extends 'base.html' %}
{% load static %}
{% block title %}홈 - 무엇이 궁금하신가요? | 똑디{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}

{% block content %}
<section class="home-hero">
  <div class="page-wrap">
    <h1 class="text-h1 home-hero__title">무엇이 궁금하신가요?</h1>

    <form action="{% url 'guide_page_list' %}" method="get" class="search-box" id="searchForm">
      <input type="text"
             name="q"
             id="searchInput"
             class="search-box__input"
             placeholder="    예: 카카오톡 인증서 어떻게 받아요?"
             autocomplete="off">

      <button type="submit" class="search-box__submit" aria-label="검색하기">
        <span class="material-symbols-rounded">search</span>
      </button>
    </form>

    <div class="search-hint card">
      <p class="text-body search-hint__title">검색이 막막하신가요?</p>
      <p class="text-body search-hint__desc">이렇게 입력해보세요.</p>

      <div class="search-hint__examples">
        <button type="button" class="hint-chip" data-fill="정부24 어디에서 로그인해요?">
          <span class="text-small">어디에서?</span> 정부24, 카카오톡
        </button>
        <button type="button" class="hint-chip" data-fill="카카오톡에서 증명서 발급 어떻게 해요?">
          <span class="text-small">무엇을?</span> 예약, 증명서 발급
        </button>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/home.js' %}"></script>
<script>
  window.DDOKDI_IS_AUTHENTICATED = {{ user.is_authenticated|yesno:"true,false" }};
  window.DDOKDI_LOGIN_URL = "#";
</script>
{% endblock %}
