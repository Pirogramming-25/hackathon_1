{% extends 'base.html' %}
{% load static %}

{% block title %}설명서 목록 - 똑디{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/guide_list.css' %}">
{% endblock %}

{% block content %}
<div class="guide-list-page page-wrap">
    <h1 class="page-title">설명서 목록</h1>

    <div class="search-section">
        <form action="{% url 'guide_page_list' %}" method="GET" class="search-form" id="guideSearchForm">
            <input
                type="text"
                name="q"
                class="search-input"
                id="guideSearchInput"
                placeholder="검색어를 입력해주세요"
                autocomplete="off"
            >
            <button type="submit" class="search-submit" aria-label="설명서 검색">
                <span class="material-symbols-rounded">search</span>
            </button>
        </form>
    </div>

    <div class="filter-section">
        <button type="button" class="filter-btn active" data-sort="latest">최신순</button>
        <button type="button" class="filter-btn" data-sort="most_scrapped">저장순</button>
    </div>

    <p class="guide-list-status" id="guideListStatus" role="status">설명서를 불러오는 중입니다.</p>
    <div class="guide-grid" id="guideGrid"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/guide_list.js' %}"></script>
{% endblock %}
